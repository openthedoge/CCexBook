org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.nonTransitiveRClass=true
# 仅为本地单元测试（Robolectric）启用：测试 classpath 含 androidx，
# 应用本体仍为零第三方依赖
android.useAndroidX=true
org.gradle.daemon=true
# 项目位于含中文的目录，关闭 AGP 的非 ASCII 路径检查
android.overridePathCheck=true
# 固定构建用 JDK 17（AGP 8.5.2 / Gradle 8.7 不支持 JDK 25），
# 这样即使系统 PATH 上是别的 JDK 也能直接构建
org.gradle.java.home=C:\\AndroidBuild\\jdk17
